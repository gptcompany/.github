# Enterprise AI Code Review using Claude Code Headless
# Organization: gptcompany
#
# USAGE in any repo:
#   jobs:
#     ai-review:
#       uses: gptcompany/.github/.github/workflows/_reusable-ai-review.yml@main
#       with:
#         review-focus: "security,performance,patterns"

name: AI Code Review (Reusable)

on:
  workflow_call:
    inputs:
      review-focus:
        description: 'Review focus areas (comma-separated)'
        required: false
        default: 'security,logic,patterns'
        type: string
      max-files:
        description: 'Maximum files to review'
        required: false
        default: '20'
        type: string

jobs:
  claude-review:
    name: "Claude Code Review"
    runs-on: [self-hosted, shared]
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR context
        id: context
        run: |
          # Get changed files (save to file to avoid shell escaping issues)
          gh pr diff "$PR_NUMBER" --name-only | head -n "$MAX_FILES" > changed_files.txt

          # Get diff (save to file - avoids issues with parentheses and special chars)
          gh pr diff "$PR_NUMBER" | head -500 > diff.txt

          # PR title is attacker-controlled text: keep it in a file, never in an output
          # or in the script body.
          gh pr view "$PR_NUMBER" --json title -q '.title' > pr_title.txt
        # Untrusted or caller-supplied values reach the shell only as environment variables.
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MAX_FILES: ${{ inputs.max-files }}

      - name: Claude Code Review
        id: review
        run: |
          # Build review prompt from files (avoids shell escaping issues with diff content)
          {
            printf 'You are reviewing PR #%s: ' "$PR_NUMBER"
            cat pr_title.txt
            printf '\nFocus areas: %s\n\nChanged files:\n' "$REVIEW_FOCUS"
            cat changed_files.txt
            printf '\nDiff (first 500 lines):\n'
            cat diff.txt
          } > prompt.txt

          cat >> prompt.txt << 'PROMPT_EOF'

          Provide a code review with:
          1. **Summary** (2-3 sentences describing the changes)
          2. **Issues Found** (list with severity: CRITICAL/HIGH/MEDIUM/LOW)
          3. **Suggestions** (improvements, not blocking)
          4. **Verdict**: APPROVE / REQUEST_CHANGES / COMMENT

          Format as GitHub-flavored markdown. Be concise and actionable.
          PROMPT_EOF

          # Run Claude Code in headless mode (reads prompt from file)
          REVIEW=$(claude --print "$(cat prompt.txt)" 2>&1 || echo "## Review Failed

          Could not generate review. Please check Claude Code installation on runner.")

          # Save review to file
          echo "$REVIEW" > review_output.md

          # The model output is untrusted (it follows the PR diff): it travels in a file, never
          # in a step output, which would be spliced into the next script or break the
          # GITHUB_OUTPUT delimiter. Truncated to 60k bytes for GitHub.
          head -c 60000 review_output.md > review_body.md
          if grep -q '##' review_body.md; then
            echo "has_review=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_FOCUS: ${{ inputs.review-focus }}

      - name: Post review comment
        if: steps.review.outputs.has_review == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const review = require('fs').readFileSync('review_body.md', 'utf8');

            // Only post if we have actual review content
            if (review && review.length > 100 && !review.includes('Review Failed')) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## AI Code Review (Claude Code)

            ${review}

            ---
            *Automated review by Claude Code - please verify suggestions before applying*`
              });
            }

      - name: Upload review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-review-pr-${{ github.event.pull_request.number }}
          path: review_output.md
          retention-days: 30
